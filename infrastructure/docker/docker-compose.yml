version: '3.8'

services:
  # ============================================
  # Infrastructure
  # ============================================
  postgres:
    image: postgres:15
    container_name: odos-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: odos
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Frontend Application
  # ============================================
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: odos-web
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-https://placeholder.supabase.co}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-placeholder-key}
    depends_on:
      - api-gateway

  # ============================================
  # API Gateway
  # ============================================
  api-gateway:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_PATH: apps/api-gateway
    container_name: odos-api-gateway
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      SUPABASE_URL: ${SUPABASE_URL:-https://placeholder.supabase.co}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-placeholder-key}
    depends_on:
      - user-service
      - learning-service
      - roadmap-service
      - scheduler-service
      - ai-service
      - resource-document-service

  # ============================================
  # Backend Services
  # ============================================
  user-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/user-service
    container_name: odos-user-service
    ports:
      - '4001:4001'
    environment:
      NODE_ENV: development
      PORT: 4001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/odos
    depends_on:
      postgres:
        condition: service_healthy

  learning-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/learning-service
    container_name: odos-learning-service
    ports:
      - '4002:4002'
    environment:
      NODE_ENV: development
      PORT: 4002
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/odos
    depends_on:
      postgres:
        condition: service_healthy

  roadmap-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/roadmap-service
    container_name: odos-roadmap-service
    ports:
      - '4003:4003'
    environment:
      NODE_ENV: development
      PORT: 4003
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/odos
    depends_on:
      postgres:
        condition: service_healthy

  scheduler-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/scheduler-service
    container_name: odos-scheduler-service
    ports:
      - '4004:4004'
    environment:
      NODE_ENV: development
      PORT: 4004
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/odos
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/ai-service
    container_name: odos-ai-service
    ports:
      - '4005:4005'
    environment:
      NODE_ENV: development
      PORT: 4005
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/odos
    depends_on:
      postgres:
        condition: service_healthy

  resource-document-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/resource-document-service
    container_name: odos-resource-document-service
    ports:
      - '4006:4006'
    environment:
      NODE_ENV: development
      PORT: 4006
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/odos
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
